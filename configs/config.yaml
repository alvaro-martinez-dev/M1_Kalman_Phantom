# parameter config yaml
# With this yaml file we avoid hardcoding the model's parameters

# Units: MeV, mm, rad, T

# ----------------------------------
# CHECK THE FILE src/constants.py FOR VARIABLE DEFINITION !!!!!!!!!!!!!
# ----------------------------------

# ----------------------------------------------
# ------------------- Run ----------------------
# ----------------------------------------------

run:
  seed: 42
  n_events: 100000
  beam: jpsi                  # which block of beams to simulate
  decay: jpsi_mumu            # which block of decays to simulate
  plot: true                  # write report.pdf in the dataset folder

# ----------------------------------------------
# ------------------ Beams ---------------------
# ----------------------------------------------

beams:
  proton:
    particle: PROTON          # name of the constant in src/constants.py
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 700.0
    sigma_p0: 3.0

  jpsi:
    particle: JPSI
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 5000.0
    sigma_p0: 50.0

  pion:
    particle: PI_PLUS
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 200.0
    sigma_p0: 2.0

# ----------------------------------------------
# ------------------ Decays --------------------
# ----------------------------------------------

decays:
  jpsi_mumu:
    channel: JPSI_MUMU                    # DecayChannel in src/constants.py
    input: init_beam/jpsi_n100000_seed42  # parent dataset, relative to data/
    seed: 43                              # must differ from the seed of the parent dataset

  pion_munu:
    channel: PI_PLUS_MUNU
    input: init_beam/pion_n100000_seed42
    seed: 44

# ----------------------------------------------
# ----------------- Geometry -------------------
# ----------------------------------------------
# Note: Project supported for magnet after phantom, not inverted, not on spatial superposition
# ----------------------------------------------

geometry:
  spacing_after_magnet: 200 # [mm] distance between end magnet and end of the system

  phantom:
    z_start: 50.0             # [mm] entrance of the first layer
    layers:                   # in beam order; material = Material in src/constants.py
      - {material: WATER, thickness: 200.0}
      - {material: BONE, thickness: 100.0}

  magnet:
    z_start: 400.0            # [mm] start of the magnet
    z_length: 300.0             # [mm]
    x_half_gap: 50.0            # [mm] plates at x = +-half_gap
    y_height: 100               # [mm] thickness of the magnet plates in the y axis
    B0: 1.0                   # [T] teslas
    model: biot_savart        # biot_savart / hard_edge
    biot_savart:
      n_filaments: 20
    interpolation:
      enabled: true
      dx: 1.0                 # [mm]
      dz: 2.0                 # [mm]
      margin: 100.0           # [mm]

  detector_planes: # we always generate detectors on the borders of the phantom and magnet!
    sigma_x: 0.1              # [mm] resolution of every plane
    placement: 
              # n_planes will be simetrically placed in the different regions for simplicity
              # immediately before and after the phantom/magnet there are detector planes.
              # this numbers don't account for these already established detector planes.
      n_before_phantom: 1 # number of detector planes before phantom
      n_after_phantom_before_magnet: 2 # number o detector planes after phantom and before magnet
      n_after_magnet: 1 # number of detector planes after magnet
      n_inside_magnet: 1

      inside_phantom: true # one detector at each layer interface

# -------------------------------------------------------------------
# ------------ Propagator -------------------------------------------
# -------------------------------------------------------------------

propagator: {}


# ----------------------------------------------
# ------------------ Kalman --------------------
# ----------------------------------------------

kalman: {}                    # fit options
