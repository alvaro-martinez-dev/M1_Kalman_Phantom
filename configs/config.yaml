# parameter config yaml
# With this yaml file we avoid hardcoding the model's parameters

# Units: MeV, mm, rad, T

# ----------------------------------
# CHECK THE FILE src/constants.py FOR VARIABLE DEFINITION !!!!!!!!!!!!!
# ----------------------------------

# ----------------------------------------------
# ------------------- Run ----------------------
# ----------------------------------------------

run:
  seed: 42
  n_events: 1000
  beam: proton                  # which block of beams to simulate
  decay: null #jpsi_mumu            # which block of decays to simulate
  plot: true                  # write report.pdf in the dataset folder

# ----------------------------------------------
# ------------------ Beams ---------------------
# ----------------------------------------------

beams:
  proton:
    particle: PROTON          # name of the constant in src/constants.py
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 700.0
    sigma_p0: 3.0

  jpsi:
    particle: JPSI
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 5000.0
    sigma_p0: 50.0

  pion:
    particle: PI_PLUS
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 200.0
    sigma_p0: 2.0

# ----------------------------------------------
# ------------------ Decays --------------------
# ----------------------------------------------

decays:
  jpsi_mumu:
    channel: JPSI_MUMU                    # DecayChannel in src/constants.py
    input: init_beam/jpsi_n100000_seed42  # parent dataset, relative to data/
    seed: 43                              # must differ from the seed of the parent dataset

  pion_munu:
    channel: PI_PLUS_MUNU
    input: init_beam/pion_n100000_seed42
    seed: 44

# ----------------------------------------------
# ----------------- Geometry -------------------
# ----------------------------------------------
# Note: Project supported for magnet after phantom, not inverted, not on spatial superposition
# ----------------------------------------------

geometry:
  spacing_after_last: 200     # [mm] distance between the end of the last element present
                              # (magnet, else phantom) and the end of the system

  # enabled: false removes the element; its other keys are kept but not read
  phantom:
    enabled: true
    z_start: 50.0            # [mm] entrance of the first layer
    layers:                   # in beam order; material = Material in src/constants.py
      - {material: WATER, thickness: 100.0}
      - {material: BONE, thickness: 50.0}

  magnet:
    enabled: true             # false: no magnet and no field (straight lines in vacuum)
    z_start: 400.0           # [mm] start of the magnet
    z_length: 300.0             # [mm]
    x_half_gap: 50.0            # [mm] plates at x = +-half_gap
    y_height: 100               # [mm] thickness of the magnet plates in the y axis
    B0: 1.0                   # [T] teslas
    model: biot_savart        # biot_savart / hard_edge
    biot_savart:
      n_filaments: 20
    interpolation:            # tabulate the field once, on a grid covering the whole system in z
      enabled: true           # and the magnet gap in x (outside the gap the field is zero)
      dx: 1.0                 # [mm]
      dz: 0.5                 # [mm] set in order to minimize the interpolation error at the magnet edges (5% with dz = 2.0 mm, 10ppm with dz = 0.5 mm)

  detector_planes: # we always generate detectors on the borders of the phantom and magnet!
    enabled: true             # false: no detector planes
    sigma_x: 0.1             # [mm] resolution of every plane
    placement: 
              # n_planes will be simetrically placed in the different regions for simplicity
              # immediately before and after the phantom/magnet there are detector planes.
              # this numbers don't account for these already established detector planes.
              # If the phantom or the magnet is disabled, the two regions around it merge and get
              # the planes of both (see src/geometry/detectors.py); its own keys are ignored.
      n_before_phantom: 1 # number of detector planes before phantom
      n_after_phantom_before_magnet: 2 # number o detector planes after phantom and before magnet
      n_after_magnet: 1 # number of detector planes after magnet
      n_inside_magnet: 1

      inside_phantom: true # one detector at each layer interface

# -------------------------------------------------------------------
# ------------ Propagator -------------------------------------------
# -------------------------------------------------------------------

propagator:
  # Monte Carlo of the full propagation (scripts/generate_propagation.py): true state at each plane
  input: init_beam/proton_n100000_seed42   # dataset of initial beam, relative to data/ (charged particles)
  seed: 45    # seed for scattering kicks; must differ from the seed of the input
  n_max: 1000 # number of tracks to propagate, chosen at random from the input (null: all of them).
              # Must be <= the number of tracks of the input. Write it as an integer (1000, not 1e3)

  step: 1.0                   # [mm] RK step (fixed), or initial and maximum step (adaptive)
  adaptive: false             # adaptive steps (error control with the tolerances) instead of fixed ones
  tolerances:                 # local error allowed per step (only if adaptive)
    x: 1.0e-6                 # [mm]
    tx: 1.0e-8                # in the phantom
    qp_rel: 1.0e-8            # relative, in q/p, in the phantom

  scattering:                 # multiple Coulomb scattering in the phantom (Highland, per slice)
    enabled: true             # false: no slices, the Monte Carlo propagates without kicks
    max_slice: 5.0            # [mm] maximum slice length; each layer is cut into equal slices
                              # (never across an interface), one kick at the end of each


# ----------------------------------------------
# ------------------ Kalman --------------------
# ----------------------------------------------

kalman: {}                    # fit options
