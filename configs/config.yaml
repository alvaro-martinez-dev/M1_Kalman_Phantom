# parameter config yaml
# With this yaml file we avoid hardcoding the model's parameters

# Units: MeV, mm, rad

# ----------------------------------------------
# ------------------- Run ----------------------
# ----------------------------------------------

run:
  seed: 42
  n_events: 100000
  beam: jpsi                  # which block of beams to simulate
  decay: jpsi_mumu            # which block of decays to simulate
  plot: true                  # write report.pdf in the dataset folder

# ----------------------------------------------
# ------------------ Beams ---------------------
# ----------------------------------------------

beams:
  proton:
    particle: PROTON          # name of the constant in src/constants.py
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 700.0
    sigma_p0: 3.0

  jpsi:
    particle: JPSI
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 5000.0
    sigma_p0: 50.0

  pion:
    particle: PI_PLUS
    x0: 0.0
    sigma_x0: 1.0
    theta0: 0.0
    sigma_theta0: 1.0e-3
    p0: 200.0
    sigma_p0: 2.0

# ----------------------------------------------
# ------------------ Decays --------------------
# ----------------------------------------------

decays:
  jpsi_mumu:
    channel: JPSI_MUMU                    # DecayChannel in src/constants.py
    input: init_beam/jpsi_n100000_seed42  # parent dataset, relative to data/
    seed: 43                              # must differ from the seed of the parent dataset

  pion_munu:
    channel: PI_PLUS_MUNU
    input: init_beam/pion_n100000_seed42
    seed: 44

# ----------------------------------------------
# ----------------- Geometry -------------------
# ----------------------------------------------

geometry:
  phantom:
    z_start: 50.0             # [mm] entrance of the first layer
    layers:                   # in beam order; material = Material in src/constants.py
      - {material: WATER, thickness: 200.0}

  magnet:
    z_start: 400.0            # [mm] start of the magnet
    length: 300.0             # [mm]
    half_gap: 50.0            # [mm] plates at x = +-half_gap
    height: 100               # [mm]
    B0: 1.0                   # [T] converted to natural units when loaded
    model: biot_savart        # biot_savart / hard_edge
    biot_savart:
      n_filaments: 20
    interpolation:
      enabled: true
      dx: 1.0                 # [mm]
      dz: 2.0                 # [mm]
      margin: 100.0           # [mm]

  detector_planes:
    sigma_x: 0.1              # [mm] resolution of every plane
    spacing_after_magnet: 100 # [mm]
    placement: 
              # n_planes will be equispaced
              # immediately before and after the phantom/magnet there are detector planes.
              # this numbers don't account for these already established detector planes.
      n_before_phantom: 1 # (n_before_phantom + 1) detector planes
      n_after_phantom_before_magnet: 1 # (n_after_phantom_before_magnet + 2) planes
      n_after_magnet: 1 # (n_after_magnet + 1) planes
      n_inside_phantom: 0
      n_inside_magnet: 1


# ----------------------------------------------
# ------------------ Kalman --------------------
# ----------------------------------------------

kalman: {}                    # fit options

# ----------------------------------------------
# ----------------- Field ----------------------
# ----------------------------------------------

Magnet:
  z_start: 400.0    # z position of the start of the magnet
  length: 300.0     # length of the magnet
  half_gap: 50.0     # plates in +- 50.0 mm
  B0: 1.0          # [T] magnetic field strength
  model: biot_savart  # model of the magnetic field: biot_savart/hard_edge
  biotsavart:
    n_filaments: 20
  interpolation:
    enable: true
    dx: 1.0
    dz: 2.0
    margin: 100.0